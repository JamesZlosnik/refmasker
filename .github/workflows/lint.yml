name: lint

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: these jobs only check out and test.
permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.5  # keep in step with environment.yml
      - name: ruff check
        run: ruff check src tests
      - name: ruff format
        run: ruff format --check src tests
