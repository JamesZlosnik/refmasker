name: tests

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: these jobs only check out and test.
permissions:
  contents: read

# Fast tests only. Tests that need the bioinformatics tools are marked `slow`
# and run locally inside the conda environment (pytest -m slow).
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -m "not slow" -q
