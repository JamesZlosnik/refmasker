name: tests

on:
  push:
    branches: [main]
  pull_request:

# Fast tests only. Tests that need the bioinformatics tools are marked `slow`
# and run locally inside the conda environment (pytest -m slow).
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -m "not slow" -q
