# The Python side of refmasker only: no bioconda tools, so no mask building.
#
# For machines that cannot run the tools (macOS has no ISEScan or geNomad build) or need not:
# `refmasker compare`, `refmasker check` and the reports all work from here. The environment
# is called refmasker, the same as the full one, so you never juggle two names for it.
#
#   conda env create -f environment-notools.yml      # or mamba
#   conda activate refmasker
#   pip install --no-deps .                          # from a refmasker checkout
#
# Versions match environment.yml, and no build is pinned, so this should solve on linux-64
# and osx-arm64 alike. If one of these has no build for your platform, drop that single pin
# rather than the file.
name: refmasker
channels:
  - conda-forge
dependencies:
  - python=3.12
  - biopython=1.88
  # matplotlib draws the report figures. Without it, `refmasker compare` still writes its
  # report, with the tables but no plots; `refmasker run` needs it for report.pdf.
  - matplotlib-base=3.11.2
  - pip=26.2.2
  # tests and lint, as in environment.yml
  - pytest=9.2.0
  - ruff=0.17.5
